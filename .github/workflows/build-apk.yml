name: Build Android Desktop Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json is missing from the repository root. Upload the CONTENTS of this ZIP, not the ZIP file itself."
            ls -la
            exit 1
          fi
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build) process.exit(1)" || {
            echo "::error::package.json must define an npm build script."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK "tools" was retired. v4 with explicit packages avoids
      # the failing default used by setup-android v3 in the previous run.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Configure landscape and Home launcher support
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, sys

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              print("AndroidManifest.xml was not generated.", file=sys.stderr)
              sys.exit(1)

          text = manifest.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(<activity\b(?=[^>]*\bandroid:name="[^"]*MainActivity")[^>]*)(>)',
              re.DOTALL
          )
          match = pattern.search(text)
          if not match:
              print("Could not find the generated MainActivity declaration.", file=sys.stderr)
              sys.exit(1)

          activity_tag = match.group(1)
          if "android:screenOrientation=" not in activity_tag:
              activity_tag += ' android:screenOrientation="landscape"'
          text = text[:match.start(1)] + activity_tag + text[match.end(1):]

          activity_start = text.find(activity_tag)
          activity_end = text.find("</activity>", activity_start)
          if activity_end < 0:
              print("Could not find MainActivity closing tag.", file=sys.stderr)
              sys.exit(1)

          activity_block = text[activity_start:activity_end]
          if "android.intent.category.HOME" not in activity_block:
              home_filter = (
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.MAIN" />\n'
                  '            <category android:name="android.intent.category.HOME" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '        </intent-filter>\n'
              )
              text = text[:activity_end] + home_filter + text[activity_end:]

          manifest.write_text(text, encoding="utf-8")
          print("Configured MainActivity for landscape and Android Home selection.")
          PY

      - name: Add native device controls and Open with bridge
        shell: bash
        run: |
          set -e
          JAVA_DIR="android/app/src/main/java/com/example/desktoplauncher"
          mkdir -p "$JAVA_DIR" "android/app/src/main/res/xml"
          cat > "$JAVA_DIR/DesktopBridgePlugin.java" <<'JAVA'
          package com.example.desktoplauncher;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioManager;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.provider.Settings;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "DesktopBridge")
          public class DesktopBridgePlugin extends Plugin {
            @PluginMethod public void getDeviceStatus(PluginCall call) {
              Context context = getContext();
              JSObject result = new JSObject();
              BatteryManager battery = (BatteryManager) context.getSystemService(Context.BATTERY_SERVICE);
              int level = battery == null ? -1 : battery.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);
              result.put("batteryLevel", level >= 0 && level <= 100 ? level : JSObject.NULL);
              Intent batteryIntent = context.registerReceiver(null, new android.content.IntentFilter(Intent.ACTION_BATTERY_CHANGED));
              int status = batteryIntent == null ? -1 : batteryIntent.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
              result.put("charging", status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL);
              AudioManager audio = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
              if (audio != null) {
                int max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                int current = audio.getStreamVolume(AudioManager.STREAM_MUSIC);
                result.put("volume", max > 0 ? Math.round(current * 100f / max) : 0);
              }
              boolean connected = false, wifi = false;
              ConnectivityManager cm = (ConnectivityManager) context.getSystemService(Context.CONNECTIVITY_SERVICE);
              if (cm != null) {
                Network active = cm.getActiveNetwork();
                NetworkCapabilities caps = active == null ? null : cm.getNetworkCapabilities(active);
                if (caps != null) {
                  connected = caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
                  wifi = caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI);
                }
              }
              result.put("networkConnected", connected);
              result.put("wifiConnected", wifi);
              call.resolve(result);
            }

            @PluginMethod public void setVolume(PluginCall call) {
              int percent = call.getInt("percent", 50);
              percent = Math.max(0, Math.min(100, percent));
              AudioManager audio = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              if (audio == null) { call.reject("Audio service is unavailable"); return; }
              int max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
              audio.setStreamVolume(AudioManager.STREAM_MUSIC, Math.round(max * percent / 100f), 0);
              JSObject result = new JSObject(); result.put("volume", percent); call.resolve(result);
            }

            @PluginMethod public void openSystemSettings(PluginCall call) {
              String section = call.getString("section", "general");
              String action;
              switch (section) {
                case "wifi": case "internet": action = Settings.ACTION_WIFI_SETTINGS; break;
                case "sound": action = Settings.ACTION_SOUND_SETTINGS; break;
                case "battery": action = Settings.ACTION_BATTERY_SAVER_SETTINGS; break;
                default: action = Settings.ACTION_SETTINGS;
              }
              try {
                Activity activity = getActivity();
                if (activity == null) { call.reject("Activity unavailable"); return; }
                activity.startActivity(new Intent(action)); call.resolve();
              } catch (Exception e) { call.reject("Could not open Android settings", e); }
            }

            @PluginMethod public void openWith(PluginCall call) {
              String name = call.getString("name", "document");
              String mime = call.getString("mimeType", "application/octet-stream");
              String base64 = call.getString("base64", "");
              if (base64.isEmpty()) { call.reject("No file content was provided"); return; }
              try {
                File dir = new File(getContext().getCacheDir(), "open-with");
                if (!dir.exists() && !dir.mkdirs()) throw new Exception("Could not create temporary folder");
                String safeName = name.replaceAll("[^a-zA-Z0-9._-]", "_");
                File out = new File(dir, System.currentTimeMillis() + "_" + safeName);
                byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                try (FileOutputStream stream = new FileOutputStream(out)) { stream.write(bytes); }
                Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", out);
                Intent view = new Intent(Intent.ACTION_VIEW);
                view.setDataAndType(uri, mime);
                view.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                Intent chooser = Intent.createChooser(view, "Open with");
                chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(chooser);
                call.resolve();
              } catch (Exception e) { call.reject("Android could not open this file type", e); }
            }
          }
          JAVA
          python3 <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('android/app/src/main/java')
          activity_matches = list(root.rglob('MainActivity.java'))
          if not activity_matches:
              print('Generated MainActivity.java not found', file=sys.stderr); sys.exit(1)
          activity = activity_matches[0]
          base = activity.parent
          text = activity.read_text(encoding='utf-8')
          package_match = re.search(r'^package\s+([\w.]+);', text, re.M)
          if not package_match:
              print('Could not determine MainActivity package', file=sys.stderr); sys.exit(1)
          pkg = package_match.group(1)
          plugin_path = base / 'DesktopBridgePlugin.java'
          template = Path('android/app/src/main/java/com/example/desktoplauncher/DesktopBridgePlugin.java')
          plugin_text = template.read_text(encoding='utf-8')
          plugin_text = re.sub(r'^package\s+[\w.]+;', 'package ' + pkg + ';', plugin_text, count=1, flags=re.M)
          plugin_path.write_text(plugin_text, encoding='utf-8')
          if 'DesktopBridgePlugin' not in text:
              text = text.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport ' + pkg + '.DesktopBridgePlugin;\nimport android.view.View;')
              text = re.sub(r'(public class MainActivity extends BridgeActivity\s*\{)', r'\1\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(DesktopBridgePlugin.class);\n        super.onCreate(savedInstanceState);\n        hideDesktopSystemBars();\n    }\n    @Override\n    public void onWindowFocusChanged(boolean hasFocus) {\n        super.onWindowFocusChanged(hasFocus);\n        if (hasFocus) hideDesktopSystemBars();\n    }\n    private void hideDesktopSystemBars() {\n        getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN);\n    }', text, count=1)
          activity.write_text(text, encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          if 'android.permission.ACCESS_NETWORK_STATE' not in m:
              m = m.replace('<application', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          if '.fileprovider' not in m:
              provider = '''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/desktop_file_paths" />
                  </provider>
          '''
              m = m.replace('</application>', provider + '\n    </application>')
          manifest.write_text(m, encoding='utf-8')
          Path('android/app/src/main/res/xml/desktop_file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="open_with_cache" path="open-with/" />
          </paths>
          ''', encoding='utf-8')
          print('Native device status, volume, Android settings and Open with bridge added.')
          PY

      - name: Verify Android project files
        shell: bash
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          test -d android/app/src/main/assets/public

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Desktop-Launcher-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
